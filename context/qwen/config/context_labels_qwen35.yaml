contexts:
  0:
    name: approach
    description: 'The robot finger moves closer to the valve lever. Require visible approach; lack of force alone does not establish approach.'
  1:
    name: turning
    description: 'The RIGHT finger applies force while turning the lever. The camera moves with the finger and lever: the lever may stay nearly fixed in the image while the fixed rig, signs and background rotate relative to the finger. Right-finger force together with this coherent background rotation and maintained finger-lever interaction supports turning. Visible motion of the lever within the image is not required.'
  2:
    name: finish
    description: 'The RIGHT finger force magnitude |F| drops sharply relative to its recent observed level. Assign finish when this sharp decrease is observed at the current time. A preceding force increase, visible stop of rotation, or retreat from the lever is not required. A steady low force, a small fluctuation, or missing force samples alone does not establish finish.'
  3:
    name: error
    description: 'The valve lever turns while valid finger-force observations show no force, OR the previously visible lever disappears from view. Interpret lever motion using the moving-camera geometry; background movement from camera repositioning alone does not establish lever turning. Lever disappearance is an error even during retreat. Missing force samples do not mean no force.'
unknown_label: -1
label_version: v8_qwen35
policy_config: train_diffusion_unet_timm_umi_dual_ft_workspace
dataset_overrides: []
output_dir: data/context_labels_v8_qwen35
# Paths are relative to the umi_ft repository root.
backend: qwen3_5
inference_python: context/qwen/.venv35/bin/python
model_path: context/qwen/checkpoints/Qwen3.5-9B
max_pixels: 50176  # 224 * 224, matching the recorded RGB resolution.
inputs:
  rgb: true
  rgb_frames: 8
  tcp_position: false
  tcp_rotation: true
  gripper_width: true
  force_torque: true  # Read native F/T; Qwen receives only |F|, no axes or torques.
  # Native force is read here; the force/visual mode replaces LLM force statistics.
  force_history_bins: 12
  previous_labels: true
  previous_label_count: 8
offline: true
seed: 42
# Native RGB is ~60 Hz; stride 6 labels ~10 anchors/second.
label_stride: 6
history_length: 121  # About 2 seconds of past RGB, ending at the labeled frame.
max_new_tokens: 128
# Qwen returns visual observations; numeric force rules determine admissible phases.
decision_mode: force_visual_v1
force_decision:
  contact_on_N: 0.5   # User-selected trial thresholds; validate before bulk labeling.
  contact_off_N: 0.3
  recent_s: 0.05
  reference_start_s: 0.25
  reference_end_s: 0.10
  max_age_s: 0.05
  max_gap_s: 0.05
  min_samples: 3
  trend_deadband_N: 0.2
  drop_absolute_N: 1.0
  drop_fraction: 0.35
prompt_suffix: ''
max_retries: 2
