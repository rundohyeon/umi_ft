# Neuromeka Indy + Dynamixel gripper waypoint sequence
#
# Robot:
#   movej  + absolute  -> joint angles in DEGREES
#   movel  + absolute  -> TCP in base frame [x,y,z,u,v,w] mm/deg
#   movel  + relative  -> delta in BASE/reference frame (not teach-pendant joy)
#   movel  + tcp       -> delta in TOOL frame (matches joy / jog on pendant)
#
# Gripper (Dynamixel):
#   type: gripper
#   target: open | close | <integer ticks>
#
# Gripper tuning (top-level gripper: section and/or per-waypoint overrides):
#   pwm_limit         - XL430 (model 1060): max PWM output 0-885 or fraction <=1
#   current_limit     - XM/XC only: max current in A (<10) or raw units
#   finish_mode       - goal | stopped | time
#                       goal    = wait until position within tolerance (use for full open/close)
#                       stopped = wait until motor stops (grasp only; may stop before close_position)
#                       time    = wait finish_time_s after sending command
#   finish_time_s     - seconds to hold for finish_mode=time, or minimum run time for stopped
#   move_timeout_s    - max wait before timeout error (alias: timeout_s)
#   move_tolerance    - position error allowed for finish_mode=goal (alias: tolerance)
#   profile_velocity  - motion speed (lower = slower)
#   profile_acceleration

defaults:
  vel_ratio: 10
  acc_ratio: 15
  dwell_s: 0.5

gripper:
  port: /dev/ttyUSB0
  id: 1
  baudrate: 57600
  open_position: 1700
  close_position: 650
  profile_velocity: 30
  profile_acceleration: 15
  pwm_limit: 0.85
  keep_torque: true
  finish_mode: goal
  finish_time_s: 2.0
  move_timeout_s: 8.0
  move_tolerance: 25

waypoints:
